[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "watermarking-fingerprinting"
version = "0.1.0"
description = "Image watermarking and perceptual fingerprint robustness benchmark"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.10",
    "numpy>=1.26",
    "pandas>=2.2",
    "Pillow>=10.0",
    "PyYAML>=6.0",
    "scikit-image>=0.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
image-fingerprint = "fingerprint.cli:main"
watermark-benchmark = "evaluation.benchmark:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
